# Release: a tag push v<maj>.<min> builds against the versioned stable OMD
# package (omd-<maj>.<min>-labs-edition from the stable repo) and publishes
# BOTH tags:
#   :v<maj>.<min>  - the immutable release tag
#   :latest        - re-pointed to this release (newest published v* wins;
#                    releases are assumed to be published in ascending order)
#
# Test builds for this ref already run via .github/workflows/ci.yml on the
# push of the tag - this workflow adds the publish.
name: Release (tag push)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to (re)publish, without the v prefix, e.g. 5.81'
        type: string
        required: true
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

env:
  # workflow_dispatch input (bare, e.g. 5.81); on tag pushes this is empty
  # and the jobs derive the version from GITHUB_REF_NAME instead
  VERSION: ${{ inputs.version }}

jobs:
  docker_build:
    runs-on: ${{ matrix.target.runs }}
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - rocky
          - debian
        target:
          - runs: ubuntu-24.04
            platform: amd64
          - runs: ubuntu-24.04-arm
            platform: arm64
    steps:
      - name: Resolve version and tag
        id: r
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ver="${GITHUB_REF_NAME#v}"      # v5.81 -> 5.81
          else
            ver="$VERSION"
          fi
          case "$ver" in *[!0-9.]*|"") echo "::error::invalid version '$ver' (expected e.g. 5.81)"; exit 1;; esac
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "::notice title=Release::publishing v$ver (and re-pointing latest)"

      - name: Check out the repo (the release tag)
        uses: actions/checkout@v7
        with:
          ref: v${{ steps.r.outputs.ver }}

      # Docker Hub publishing is disabled for now; images go to GHCR only.
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v4.8.0
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          # built-in workflow token (short-lived, per-run; the job's
          # "permissions: packages: write" grants the GHCR push) - no
          # personal account, no stored secret
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup tmate session, see https://github.com/marketplace/actions/debugging-with-tmate
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

      # the release tag only; :latest is created by the manifest job so
      # the multi-arch manifest can carry both names in one go
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          push: true
          file: Dockerfile.omd-labs-systemd-vm-${{ matrix.os }}
          sbom: false
          provenance: false
          build-args: |
            OMD_VERSION=${{ steps.r.outputs.ver }}
            INSTALL_COMMON_RETRIES=3
            BUILDKIT_MULTI_PLATFORM=0
          # Docker Hub publishing is disabled for now (GHCR only). The
          # disabled tag is kept OUT of the tags block on purpose: the
          # build-push action passes every line of the block to buildx,
          # so a comment line there becomes an invalid tag.
          # consol/omd-labs-systemd-vm-${{ matrix.os }}:v${{ steps.r.outputs.ver }}-${{ matrix.target.platform }}
          tags: |
            ghcr.io/consol-monitoring/omd-labs-systemd-vm-forge/omd-labs-systemd-vm-${{ matrix.os }}:v${{ steps.r.outputs.ver }}-${{ matrix.target.platform }}
          platforms: linux/${{ matrix.target.platform }}

  manifest:
    runs-on: ubuntu-24.04
    needs: docker_build
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - rocky
          - debian
    steps:
      - name: Resolve version and tag
        id: r
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver="$VERSION"
          fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "::notice title=Release::publishing v$ver (and re-pointing latest)"

      - uses: actions/checkout@v7
        with:
          ref: v${{ steps.r.outputs.ver }}

      # Docker Hub publishing is disabled for now; images go to GHCR only.
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v4.8.0
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          # built-in workflow token (short-lived, per-run; the job's
          # "permissions: packages: write" grants the GHCR push) - no
          # personal account, no stored secret
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup tmate session, see https://github.com/marketplace/actions/debugging-with-tmate
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

      # Docker Hub publishing is disabled for now; images go to GHCR only.
      # - name: push manifest to dockerhub
      #   run: |
      #       docker manifest create consol/omd-labs-systemd-vm-${{ matrix.os }}:v${{ steps.r.outputs.ver }} \
      #                              consol/omd-labs-systemd-vm-${{ matrix.os }}:v${{ steps.r.outputs.ver }}-amd64 \
      #                              consol/omd-labs-systemd-vm-${{ matrix.os }}:v${{ steps.r.outputs.ver }}-arm64
      #       docker manifest push consol/omd-labs-systemd-vm-${{ matrix.os }}:v${{ steps.r.outputs.ver }}

      - name: push manifest to github (release tag + latest)
        run: |
            IMG=ghcr.io/consol-monitoring/omd-labs-systemd-vm-forge/omd-labs-systemd-vm-${{ matrix.os }}
            docker manifest create "$IMG:v${{ steps.r.outputs.ver }}" \
                                   "$IMG:v${{ steps.r.outputs.ver }}-amd64" \
                                   "$IMG:v${{ steps.r.outputs.ver }}-arm64"
            docker manifest push "$IMG:v${{ steps.r.outputs.ver }}"
            docker manifest create "$IMG:latest" \
                                   "$IMG:v${{ steps.r.outputs.ver }}-amd64" \
                                   "$IMG:v${{ steps.r.outputs.ver }}-arm64"
            docker manifest push "$IMG:latest"
